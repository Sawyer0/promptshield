name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive validation
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build artifacts not found"
            exit 1
          fi
          echo "Build validation passed"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: validate-deployment
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create staging package
        run: |
          mkdir -p staging-artifacts
          cp -r dist/* staging-artifacts/
          cp -r bin/* staging-artifacts/
          cp README.md staging-artifacts/
          cp LICENSE staging-artifacts/
          cp package.json staging-artifacts/

      - name: Upload staging artifacts
        uses: actions/upload-artifact@v3
        with:
          name: staging-build
          path: staging-artifacts/
          retention-days: 7

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Build artifacts created successfully"
          echo "Staging deployment completed"

  deploy-production:
    runs-on: ubuntu-latest
    needs: validate-deployment
    if: github.event.inputs.environment == 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create production package
        run: |
          mkdir -p production-artifacts
          cp -r dist/* production-artifacts/
          cp -r bin/* production-artifacts/
          cp README.md production-artifacts/
          cp LICENSE production-artifacts/
          cp package.json production-artifacts/

      - name: Upload production artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-build
          path: production-artifacts/
          retention-days: 30

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Production deployment completed"

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ] || [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "Deployment completed successfully!"
            echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          else
            echo "Deployment failed!"
            echo "Check the logs for details."
          fi
