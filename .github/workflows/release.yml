name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive validation
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log --oneline $(git describe --tags --abbrev=0 HEAD^)..HEAD >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes in this Release

            ${{ env.CHANGELOG }}

            ## Installation

            ```bash
            npm install -g promptshield
            ```

            ## Usage

            ```bash
            promptshield scan <file> --rulepack <rulepack>
            ```
          draft: false
          prerelease: false

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release artifacts
        run: |
          mkdir -p release-artifacts
          cp -r dist/* release-artifacts/
          cp -r bin/* release-artifacts/
          cp README.md release-artifacts/
          cp LICENSE release-artifacts/
          cp package.json release-artifacts/

      - name: Upload release assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release-artifacts/
          asset_name: promptshield-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

  notify:
    runs-on: ubuntu-latest
    needs: release
    if: always()
    steps:
      - name: Notify on success
        if: needs.release.result == 'success'
        run: |
          echo "Release ${{ github.ref }} published successfully!"
          echo "NPM: https://www.npmjs.com/package/promptshield"
          echo "GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref }}"

      - name: Notify on failure
        if: needs.release.result == 'failure'
        run: |
          echo "Release ${{ github.ref }} failed!"
          echo "Check the logs for details."
