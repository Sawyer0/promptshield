name: PII Rules
description: Detects various types of personally identifiable information
rules:
  - id: email
    description: Detects email addresses
    pattern: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b"
    severity: high
    category: contact
    enabled: true
  - id: phone
    description: Detects US phone numbers
    pattern: "\\b\\d{3}[-.\\s]?\\d{3}[-.\\s]?\\d{4}\\b"
    severity: medium
    category: contact
    enabled: true
  - id: ssn
    description: Detects US Social Security Numbers
    pattern: "\\b\\d{3}-\\d{2}-\\d{4}\\b"
    severity: high
    category: sensitive
    enabled: true
  - id: cc
    description: Detects credit card numbers
    pattern: "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\\b"
    severity: high
    category: sensitive
    enabled: true
  - id: address
    description: Detects US-style street addresses
    pattern: "\\d{1,5}\\s+([A-Za-z0-9.,'\\-\\s]+)\\s+(Street|St|Avenue|Ave|Boulevard|Blvd|Road|Rd|Lane|Ln|Drive|Dr|Court|Ct|Circle|Cir|Way|Place|Pl)"
    severity: medium
    category: contact
    enabled: true
