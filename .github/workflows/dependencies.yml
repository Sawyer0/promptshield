name: Dependencies

on:
  schedule:
    # Run dependency updates weekly
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated dependencies
        run: npm outdated

      - name: Update dependencies
        run: |
          npm update
          npm audit fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: update dependencies'
          body: |
            ## Dependency Updates

            This PR updates dependencies to their latest compatible versions.

            ### Changes
            - Updated npm dependencies
            - Applied security fixes

            ### Testing
            - [ ] All tests pass
            - [ ] No breaking changes
            - [ ] Security audit passes
          branch: dependabot/update-dependencies
          delete-branch: true

  security-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Fix security vulnerabilities
        run: npm audit fix

      - name: Create security update PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'security: fix vulnerabilities'
          title: 'security: fix vulnerabilities'
          body: |
            ## Security Updates

            This PR fixes security vulnerabilities in dependencies.

            ### Changes
            - Applied security patches
            - Updated vulnerable dependencies

            ### Testing
            - [ ] Security audit passes
            - [ ] All tests pass
            - [ ] No breaking changes
          branch: security/update-vulnerabilities
          delete-branch: true

  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clean up
        run: |
          npm cache clean --force
          rm -rf node_modules
          npm install

      - name: Check for unused dependencies
        run: |
          npx depcheck || echo "Depcheck completed with warnings"

      - name: Generate dependency report
        run: |
          npm ls --depth=0 > dependency-report.txt
          npm audit --json > security-report.json

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: dependency-reports
          path: |
            dependency-report.txt
            security-report.json
          retention-days: 30
