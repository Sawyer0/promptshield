schema_version: 1.0.0
version: 1.2.0
last_updated: 2025-06-01
name: "PII Detection"
description: "Detects personally identifiable information (PII) in prompts, responses, and datasets."
rules:
  - id: "pii-email"
    name: "Email Address Detection"
    description: "Detects email addresses in content."
    severity: "high"
    enabled: true
    type: "regex"
    pattern: "\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b"
    message: "Email address detected: {match}"
    tags: ["pii", "email"]

  - id: "pii-phone"
    name: "Phone Number Detection"
    description: "Detects US phone numbers in content."
    severity: "medium"
    enabled: true
    type: "regex"
    pattern: "\b(?:\+1[-.\s]?)?(?:\(?\d{3}\)?[-.\s]?)?\d{3}[-.\s]?\d{4}\b"
    message: "Phone number detected: {match}"
    tags: ["pii", "phone"]

  - id: "pii-ssn"
    name: "Social Security Number Detection"
    description: "Detects US Social Security Numbers (SSN) in content."
    severity: "critical"
    enabled: true
    type: "regex"
    pattern: "\b\d{3}-\d{2}-\d{4}\b"
    message: "SSN detected: {match}"
    tags: ["pii", "ssn"]

  - id: "pii-cc"
    name: "Credit Card Number Detection"
    description: "Detects common credit card numbers (Visa, MasterCard, Amex, Discover)."
    severity: "critical"
    enabled: true
    type: "regex"
    pattern: "\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b"
    message: "Credit card number detected: {match}"
    tags: ["pii", "credit_card"]

  - id: "pii-address"
    name: "Street Address Detection"
    description: "Detects US-style street addresses (simple heuristic)."
    severity: "medium"
    enabled: true
    type: "regex"
    pattern: "\b\d{1,5}\s+([A-Za-z0-9.,'\-\s]+)\s+(Street|St|Avenue|Ave|Boulevard|Blvd|Road|Rd|Lane|Ln|Drive|Dr|Court|Ct|Circle|Cir|Way|Place|Pl)\b"
    message: "Possible street address detected: {match}"
    tags: ["pii", "address"]
